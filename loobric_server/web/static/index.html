<!DOCTYPE html>
<!--
  Loobric web inbox (loobric-server#6).
  Deliberately one static file: no build step, no dependencies, served by
  the core container. Scope (decision G2 + field feedback): read views for
  tools/machines/audit, plus housekeeping write actions — confirm/reject,
  bind/unbind, create-record, and delete of records/machines/entries.
  Anything richer belongs to Loobric Web (commercial).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loobric</title>
<style>
  :root { --bg:#10151a; --card:#1a222b; --ink:#e8edf2; --dim:#8fa1b3;
          --line:#2a3641; --ok:#3fb46a; --warn:#d9923b; --bad:#cf5b56; --link:#5ab3d6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.45 system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; gap:.75rem; padding:.7rem 1rem;
           background:var(--card); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  header h1 { font-size:1.1rem; margin:0 .5rem 0 0; }
  nav { display:flex; gap:.25rem; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--dim);
               padding:.5rem .8rem; border-radius:8px; font-size:.95rem; cursor:pointer; }
  nav button.active { color:var(--ink); border-color:var(--line); background:var(--bg); }
  nav button .n { background:var(--warn); color:#000; border-radius:9px;
                  padding:0 .45em; font-size:.8em; margin-left:.3em; }
  main { max-width:760px; margin:0 auto; padding:1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:.9rem 1rem; margin-bottom:.8rem; }
  .card.danger { border-color:var(--bad); }
  .muted { color:var(--dim); font-size:.9rem; }
  .row { display:flex; justify-content:space-between; gap:.6rem; align-items:baseline; flex-wrap:wrap; }
  .id { font-family:ui-monospace,monospace; font-size:.8rem; color:var(--dim); }
  .id.link { color:var(--link); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  .id.link:hover { color:var(--ink); text-decoration-style:solid; }
  .vs { text-align:center; color:var(--dim); margin:.4rem 0; font-size:.9rem; }
  .conf { height:6px; background:var(--line); border-radius:3px; margin:.6rem 0 .3rem; }
  .conf > div { height:100%; border-radius:3px; background:var(--warn); }
  .actions { display:flex; gap:.6rem; margin-top:.7rem; }
  .actions button { flex:1; min-height:46px; border:none; border-radius:10px;
                    font-size:1rem; font-weight:600; cursor:pointer; }
  .confirm { background:var(--ok); color:#06210f; }
  .reject  { background:var(--bad); color:#2b0c0a; }
  .unbind  { background:none; border:1px solid var(--bad) !important; color:var(--bad);
             min-height:36px !important; font-weight:500 !important; flex:0 0 auto !important;
             padding:0 .8rem; }
  .trow { display:flex; justify-content:space-between; gap:.6rem; align-items:center;
          flex-wrap:wrap; padding:.5rem 0; border-top:1px solid var(--line); }
  .trow:first-of-type { border-top:none; }
  .tinfo { display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap; min-width:0; }
  .tnum { font-weight:600; }
  .rowact { display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
  .rowact button { min-height:34px; border:none; border-radius:8px; padding:0 .7rem;
                   font-size:.85rem; font-weight:600; cursor:pointer; }
  button.mini.confirm { background:var(--ok); color:#06210f; }
  button.mini.reject  { background:var(--bad); color:#2b0c0a; }
  button.mini.link    { background:none; border:1px solid var(--link); color:var(--link); }
  button.mini.create  { background:none; border:1px solid var(--ok); color:var(--ok); }
  button.mini.del     { background:none; border:1px solid var(--bad); color:var(--bad); }
  .suggest { font-size:.82rem; margin-right:.2rem; }
  .picker { background:var(--bg); border:1px solid var(--line); color:var(--ink);
            border-radius:8px; padding:.4rem; font-size:.85rem; max-width:50vw; }
  .explain { background:#15202b; border:1px solid var(--line); border-radius:12px;
             padding:.8rem 1rem; margin-bottom:1rem; font-size:.92rem; color:var(--dim); }
  .explain b { color:var(--ink); }
  .empty { text-align:center; color:var(--dim); padding:3rem 1rem; }
  .pill { font-size:.78rem; padding:.1em .55em; border-radius:9px; border:1px solid var(--line); }
  .pill.bound { color:var(--ok); border-color:var(--ok); }
  .pill.unbound { color:var(--dim); }
  .pill.dupe { color:var(--warn); border-color:var(--warn); }
  .pill.ok   { color:var(--ok); border-color:var(--ok); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .pill.bad  { color:var(--bad); border-color:var(--bad); }
  .pill.info { color:var(--link); border-color:var(--link); }
  /* provenance badges (catalog drift detector): a claim must READ differently
     from a measurement, and an honest gap from either. */
  .prov { font-size:.72rem; font-family:ui-monospace,monospace; padding:.1em .55em;
          border-radius:9px; border:1px solid var(--line); white-space:nowrap; }
  .prov.asserted { color:var(--warn); border-color:var(--warn); }
  .prov.observed { color:var(--ok);   border-color:var(--ok); }
  .prov.derived  { color:var(--link); border-color:var(--link); }
  .prov.unknown  { color:var(--dim);  border-style:dashed; }
  .frow { display:flex; justify-content:space-between; gap:.6rem; align-items:center;
          flex-wrap:wrap; padding:.45rem 0; border-top:1px solid var(--line); }
  .frow:first-of-type { border-top:none; }
  .flabel { color:var(--dim); flex:0 0 9rem; }
  .fval { flex:1; min-width:6rem; font-weight:600; }
  .unknownval { color:var(--dim); font-style:italic; font-weight:400; }
  .section-h { font-size:.82rem; color:var(--dim); text-transform:uppercase;
               letter-spacing:.05em; margin:1rem 0 .1rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  td, th { text-align:left; padding:.35rem .4rem; border-top:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; border-top:none; }
  #login { position:fixed; inset:0; background:var(--bg); display:none;
           align-items:center; justify-content:center; z-index:10; }
  #login form { background:var(--card); border:1px solid var(--line); border-radius:14px;
                padding:1.5rem; width:min(92vw,340px); display:flex; flex-direction:column; gap:.7rem; }
  #login input { background:var(--bg); border:1px solid var(--line); color:var(--ink);
                 border-radius:8px; padding:.7rem; font-size:1rem; }
  #login button { min-height:46px; border:none; border-radius:10px; background:var(--link);
                  color:#06212b; font-size:1rem; font-weight:600; cursor:pointer; }
  #login .err { color:var(--bad); font-size:.9rem; min-height:1.2em; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--card); border:1px solid var(--line); border-radius:10px;
           padding:.6rem 1rem; opacity:0; transition:opacity .25s; max-width:92vw; }
  .spacer { flex:1; }
  #whoami { font-size:.8rem; }
  .link-ish { cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; }
  #detail { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
            align-items:center; justify-content:center; z-index:9; padding:1rem; }
  #detail .sheet { background:var(--card); border:1px solid var(--line); border-radius:14px;
                   padding:1rem; width:min(96vw,720px); max-height:86vh; display:flex; flex-direction:column; }
  #detail pre { overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:8px;
                padding:.7rem; font-size:.78rem; line-height:1.4; margin:.6rem 0 0;
                white-space:pre-wrap; word-break:break-word; }
  #ask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
         align-items:center; justify-content:center; z-index:11; padding:1rem; }
  #ask .sheet { background:var(--card); border:1px solid var(--line); border-radius:14px;
                padding:1.1rem; width:min(94vw,420px); }
  #ask #askmsg { font-size:.95rem; }
  #ask input { width:100%; margin-top:.7rem; background:var(--bg); border:1px solid var(--line);
               color:var(--ink); border-radius:8px; padding:.6rem; font-size:1rem; }
  #ask .arow { display:flex; justify-content:flex-end; gap:.5rem; margin-top:.9rem; }
  /* Create-tool-from-catalog form: a separate overlay (not rebuilt by render(),
     so the 15s auto-refresh can't wipe a half-typed name). */
  #ccreate { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
             align-items:center; justify-content:center; z-index:11; padding:1rem; }
  #ccreate .sheet { background:var(--card); border:1px solid var(--line); border-radius:14px;
                    padding:1.1rem; width:min(96vw,520px); max-height:86vh; overflow:auto; }
  #ccreate .cclabel { display:block; color:var(--dim); font-size:.82rem; margin:.6rem 0 .25rem; }
  #ccreate .ccinput { width:100%; background:var(--bg); border:1px solid var(--line);
                      color:var(--ink); border-radius:8px; padding:.6rem; font-size:1rem; }
  #ccreate .arow { display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem; }
  /* Media view (canonical.media): raster images inline, mesh 3D models in an
     in-browser WebGL viewer (opened in the #media overlay so the 15s refresh
     can't wipe a live canvas), everything else as a download link. */
  .media-grid { display:flex; flex-wrap:wrap; gap:.5rem; margin:.4rem 0 .2rem; }
  .media-thumb { width:120px; height:120px; border:1px solid var(--line); border-radius:8px;
                 background:var(--bg); overflow:hidden; display:flex; align-items:center;
                 justify-content:center; cursor:pointer; }
  .media-thumb img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .media-item { display:flex; justify-content:space-between; gap:.6rem; align-items:center;
                flex-wrap:wrap; padding:.5rem 0; border-top:1px solid var(--line); }
  .media-item:first-of-type { border-top:none; }
  .media-meta { display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap; min-width:0; }
  .media-note { flex-basis:100%; color:var(--dim); font-size:.8rem; }
  a.dl { color:var(--link); text-decoration:underline dotted; text-underline-offset:3px;
         font-size:.85rem; white-space:nowrap; }
  button.mini.view { background:none; border:1px solid var(--link); color:var(--link); }
  button.mini.view.active { background:var(--bg); color:var(--ink); }
  #media { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
           align-items:center; justify-content:center; z-index:12; padding:1rem; }
  #media .sheet { background:var(--card); border:1px solid var(--line); border-radius:14px;
                  padding:1rem; width:min(96vw,900px); height:min(90vh,720px);
                  display:flex; flex-direction:column; }
  #mediaviewer { flex:1; min-height:0; margin-top:.6rem; border:1px solid var(--line);
                 border-radius:10px; background:var(--bg); overflow:hidden; position:relative; }
  #mediaviewer canvas { display:block; }
  .media-tabs { display:flex; gap:.4rem; }
  /* Account tab: new-key and change-password overlays (separate, like #ccreate,
     so the 15s auto-refresh can't wipe a half-typed key name or password). */
  #keynew, #chpw { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
                   align-items:center; justify-content:center; z-index:11; padding:1rem; }
  #keynew .sheet, #chpw .sheet { background:var(--card); border:1px solid var(--line);
                   border-radius:14px; padding:1.1rem; width:min(96vw,520px);
                   max-height:86vh; overflow:auto; }
  #keynew .cclabel, #chpw .cclabel { display:block; color:var(--dim); font-size:.82rem;
                   margin:.6rem 0 .25rem; }
  #keynew .ccinput, #chpw .ccinput { width:100%; background:var(--bg);
                   border:1px solid var(--line); color:var(--ink); border-radius:8px;
                   padding:.6rem; font-size:1rem; }
  #keynew .arow, #chpw .arow { display:flex; justify-content:flex-end; gap:.5rem; margin-top:1rem; }
  .keycode { font-family:ui-monospace,monospace; font-size:.85rem; background:var(--bg);
             border:1px solid var(--line); border-radius:8px; padding:.6rem;
             word-break:break-all; margin:.5rem 0; }
  .krow { display:flex; justify-content:space-between; gap:.6rem; align-items:center;
          flex-wrap:wrap; padding:.55rem 0; border-top:1px solid var(--line); }
  .krow:first-of-type { border-top:none; }
</style>
</head>
<body>

<header>
  <h1>Loobric</h1>
  <nav id="tabs"></nav>
  <span class="spacer"></span>
  <span id="whoami" class="muted link-ish" title="account, keys, audit"
        onclick="setTab('account')"></span>
</header>

<main id="view"></main>

<div id="login"><form onsubmit="return doAuth(event)">
  <strong id="logintitle">Sign in to Loobric</strong>
  <input id="email" type="email" placeholder="email" autocomplete="username" required>
  <input id="password" type="password" placeholder="password" autocomplete="current-password" required>
  <div class="err" id="loginerr"></div>
  <button type="submit" id="loginbtn">Sign in</button>
  <div class="muted" style="text-align:center;font-size:.85rem">
    <span id="loginswitch" class="link-ish" onclick="toggleAuthMode()">No account? Create one</span>
  </div>
</form></div>

<div id="toast"></div>

<div id="detail" onclick="if(event.target.id==='detail')closeDetail()">
  <div class="sheet">
    <div class="row"><strong id="detailtitle"></strong>
      <button class="mini reject" onclick="closeDetail()">Close</button></div>
    <pre id="detailbody"></pre>
  </div>
</div>

<!-- 3D model viewer. A separate overlay (not rebuilt by render(), like #detail)
     so the 15s auto-refresh can't tear down a live WebGL canvas mid-spin. -->
<div id="media" onclick="if(event.target.id==='media')closeMedia()">
  <div class="sheet">
    <div class="row"><strong>3D model</strong>
      <span class="rowact"><span class="media-tabs" id="mediatabs"></span>
        <button class="mini reject" onclick="closeMedia()">Close</button></span></div>
    <div id="mediaviewer"></div>
  </div>
</div>

<!-- In-page confirm/prompt: native window.confirm/prompt can be permanently
     suppressed by the browser's "prevent additional dialogs" checkbox. -->
<div id="ask" onclick="if(event.target.id==='ask')askCancel()">
  <div class="sheet">
    <div id="askmsg"></div>
    <input id="askinput" onkeydown="if(event.key==='Enter')askOk(); else if(event.key==='Escape')askCancel();">
    <div class="arow">
      <button class="mini reject" onclick="askCancel()">Cancel</button>
      <button class="mini confirm" onclick="askOk()">OK</button>
    </div>
  </div>
</div>

<!-- Create tool from catalog: a pre-populated form (name editable; nominal
     geometry shown read-only with provenance badges). Body is filled by
     openCreateFromCatalog(). No QA/status fields here by design (M2). -->
<div id="ccreate" onclick="if(event.target.id==='ccreate')closeCreate()">
  <div class="sheet">
    <div class="row"><strong>Create tool from catalog</strong>
      <button class="mini reject" onclick="closeCreate()">Cancel</button></div>
    <div id="ccbody"></div>
  </div>
</div>

<!-- New API key: a form, then a one-time reveal of the plain key (copy now).
     A separate overlay so the 15s refresh can't wipe a half-typed name or the
     revealed key. -->
<div id="keynew" onclick="if(event.target.id==='keynew')closeKeyNew()">
  <div class="sheet">
    <div class="row"><strong>New API key</strong>
      <button class="mini reject" onclick="closeKeyNew()">Cancel</button></div>
    <div id="keynewbody"></div>
  </div>
</div>

<!-- Change password: separate overlay (same reasoning). -->
<div id="chpw" onclick="if(event.target.id==='chpw')closeChpw()">
  <div class="sheet">
    <div class="row"><strong>Change password</strong>
      <button class="mini reject" onclick="closeChpw()">Cancel</button></div>
    <label class="cclabel" for="pw_cur">Current password</label>
    <input id="pw_cur" class="ccinput" type="password" autocomplete="current-password">
    <label class="cclabel" for="pw_new">New password</label>
    <input id="pw_new" class="ccinput" type="password" autocomplete="new-password">
    <label class="cclabel" for="pw_new2">Confirm new password</label>
    <input id="pw_new2" class="ccinput" type="password" autocomplete="new-password"
           onkeydown="if(event.key==='Enter')submitChangePw(); else if(event.key==='Escape')closeChpw();">
    <div id="pwerr" style="color:var(--bad);font-size:.85rem;min-height:1em;margin-top:.4rem"></div>
    <div class="arow">
      <button class="mini reject" onclick="closeChpw()">Cancel</button>
      <button class="mini confirm" onclick="submitChangePw()">Change password</button>
    </div>
  </div>
</div>

<script>
"use strict";
// Machines is the ONE binding surface — proposals (the old Inbox) are folded in
// as a "pending review" band/filter on the entries themselves.
// Nav is the DATA (machines, tools, sets, catalog, labels); housekeeping
// (account, keys, audit, demo) lives behind the email top-right, and each
// entity tab is a list -> detail pair with the same layout.
const TABS = [["machines","Machines"],["tools","Tools"],["toolsets","Tool Sets"],["catalog","Catalog"],["labels","Labels"]];
let state = { tab:"machines", pendingOnly:false, catalogSel:null, setSel:null, machineSel:null, toolSel:null, inbox:[], tools:[], toolsets:[], machines:[], audit:[], catalogs:[],
              machineNames:{}, toolNames:{}, entriesByMachine:{}, entriesById:{}, proposalByEntry:{},
              activeMaps:[], mapByMachine:{}, reconByMachine:{}, keys:[], me:null, users:[],
              labels:[], printSel:{} };

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// A value that IS a URL (source_url and friends) renders as a real link in a
// new tab; anything else stays escaped text. Whole-value match only — no
// in-text linkification.
const isHttpUrl = (v) => typeof v === "string" && /^https?:\/\/\S+$/.test(v);
const linkify = (v) => isHttpUrl(v)
  ? `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`
  : esc(v);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.opacity=1; setTimeout(()=>t.style.opacity=0,2600); }

// In-page confirm/prompt (native dialogs can be permanently suppressed).
let _askResolve=null, _askInput=false;
function _openAsk(message, withInput, def){
  return new Promise(res=>{ _askResolve=res; _askInput=withInput;
    $("#askmsg").textContent=message;
    const inp=$("#askinput"); inp.style.display=withInput?"block":"none";
    if(withInput){ inp.value=def||""; setTimeout(()=>{ inp.focus(); inp.select(); },30); }
    $("#ask").style.display="flex"; });
}
function _askDone(v){ $("#ask").style.display="none"; const r=_askResolve; _askResolve=null; if(r) r(v); }
function askOk(){ _askDone(_askInput ? $("#askinput").value : true); }
function askCancel(){ _askDone(_askInput ? null : false); }
function confirmDialog(message){ return _openAsk(message,false).then(v=>v===true); }
function promptDialog(message, def){ return _openAsk(message,true,def); }

async function api(method, path, body){
  const r = await fetch("/api/v1"+path, {method, credentials:"same-origin",
    headers: body?{"Content-Type":"application/json"}:{}, body: body?JSON.stringify(body):undefined});
  if(r.status===401){ $("#login").style.display="flex"; throw new Error("auth"); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.detail||("HTTP "+r.status));
  return data;
}
// The login overlay does double duty: sign in OR create an account. Registration
// is open (the first account becomes admin; the rest are regular users), so a new
// user can self-serve here instead of needing the CLI.
let authMode = "login";
function setAuthMode(mode){
  authMode = mode;
  const reg = mode === "register";
  $("#logintitle").textContent = reg ? "Create your Loobric account" : "Sign in to Loobric";
  $("#loginbtn").textContent   = reg ? "Create account" : "Sign in";
  $("#loginswitch").textContent= reg ? "Have an account? Sign in" : "No account? Create one";
  $("#password").setAttribute("autocomplete", reg ? "new-password" : "current-password");
  $("#loginerr").textContent = "";
}
function toggleAuthMode(){ setAuthMode(authMode === "login" ? "register" : "login"); }

async function doAuth(ev){ ev.preventDefault();
  const email = $("#email").value, password = $("#password").value;
  try {
    if(authMode === "register"){
      await api("POST","/auth/register",{email, password});
    }
    // Either path ends in a session: register then log in to sign the new user in.
    await api("POST","/auth/login",{email, password});
    $("#login").style.display = "none";
    setAuthMode("login");
    refresh();
  } catch(e){
    $("#loginerr").textContent = authMode === "register"
      ? ("Could not create account: " + (e.message === "auth" ? "try again" : (e.message||"try a different email")))
      : "Sign-in failed - check credentials.";
  }
  return false;
}

async function doLogout(){
  try { await api("POST","/auth/logout"); } catch(e){ /* clear the UI regardless */ }
  state.me = null; $("#whoami").textContent = "";
  $("#email").value = ""; $("#password").value = ""; setAuthMode("login");
  $("#login").style.display = "flex";
}

// Read a provenance-tagged canonical field's value / source by dotted path.
function cf(obj, path){ let n=(obj&&obj.canonical)||{}; for(const p of path.split(".")) n=(n||{})[p]; return n?n.value:null; }
const rid = (o)=>o.internal.id;
// a tool-table entry's human label: its observed description, else the ";comment" parsed
// from a linuxcnc raw line (so entries synced before description flowed still show it).
function entryName(s){
  const d=cf(s,"description"); if(d) return d;
  const data=((s.clients||{}).linuxcnc||{}).data; const raw=data&&data.raw;
  if(raw){ const i=raw.indexOf(";"); if(i>=0) return raw.slice(i+1).trim()||null; }
  return null;
}

async function refresh(){
  try {
    const [inbox, tools, sets, machines, audit, catalog, keys, me, labels] = await Promise.all([
      api("GET","/instance-inbox"), api("GET","/tool-instance-records"),
      api("GET","/tool-set-records"), api("GET","/machine-records"),
      api("GET","/audit-logs?limit=50"), api("GET","/tool-catalog-records"),
      api("GET","/auth/keys"), api("GET","/auth/me"),
      api("GET","/labels").catch(()=>({items:[]}))]);
    state.inbox=inbox.items; state.tools=tools.items; state.toolsets=sets.items;
    state.labels=labels.items||[];
    state.machines=machines.items; state.audit=audit.logs||[]; state.catalogs=catalog.items;
    state.keys = Array.isArray(keys) ? keys : (keys.items||[]); state.me = me||null;
    $("#whoami").textContent = (me && me.email) ? me.email : "";
    state.machineNames=Object.fromEntries(machines.items.map(m=>[rid(m), cf(m,"name")||rid(m).slice(0,8)]));
    state.toolNames=Object.fromEntries(tools.items.map(t=>[rid(t), cf(t,"name")||rid(t).slice(0,8)]));
    state.proposalByEntry=Object.fromEntries(inbox.items.map(p=>[p.entry.id, p]));
    const tables = await Promise.all(machines.items.map(m =>
      api("GET", "/tool-table-entry-records?machine_id="+rid(m)).then(t=>[rid(m),t.items]).catch(()=>[rid(m),[]])));
    state.entriesByMachine=Object.fromEntries(tables);
    state.entriesById={}; for(const entries of Object.values(state.entriesByMachine)) for(const s of entries) state.entriesById[rid(s)]=s;
    // Setups: which set each machine is running (active map), and its derived
    // setup view (ready / claims / notes) — computed server-side at read.
    state.activeMaps = (await api("GET","/machine-set-maps?status=active").catch(()=>({items:[]}))).items||[];
    state.mapByMachine = Object.fromEntries(state.activeMaps.map(x=>[x.machine_id,x]));
    const recons = await Promise.all(machines.items.map(m =>
      api("GET","/machine-set-maps/status?machine_id="+rid(m)).then(r=>[rid(m),r]).catch(()=>[rid(m),null])));
    state.reconByMachine = Object.fromEntries(recons);
    // Admin-only: the account roster (how many accounts exist, and who they are).
    // Non-admins get a 403 here, so only fetch it for admins and tolerate failure.
    state.users = isAdmin(me)
      ? await api("GET","/admin/users").then(u=>u.users||[]).catch(()=>[]) : [];
    render();
  } catch(e){ if(e.message!=="auth") toast("Load failed: "+e.message); }
}

function unboundEntries(){
  const out=[];
  for(const m of state.machines) for(const s of (state.entriesByMachine[rid(m)]||[]))
    if(cf(s,"bound_instance_id")==null) out.push({entry:s, machine:m});
  return out;
}
// "Pending review": unbound entries the server has a proposed match for, awaiting
// a Same tool / Different decision. (Unbound entries with no guess just bind new.)
function hasProposal(entry){
  const p=state.proposalByEntry[rid(entry)];
  return !!(p && p.proposed_instance && p.proposed_instance.id);
}
function pendingEntries(){ return unboundEntries().filter(({entry})=>hasProposal(entry)); }
function togglePending(){ state.pendingOnly=!state.pendingOnly; render(); }

// Admin check tolerant of either signal: is_admin (the bool) or role==="admin".
// Older servers omitted is_admin from /auth/me, so role is the reliable fallback.
function isAdmin(me){ return !!me && (me.is_admin === true || me.role === "admin"); }

function render(){
  const pending = pendingEntries().length;
  $("#tabs").innerHTML = TABS.map(([id,label])=>
    `<button class="${state.tab===id?"active":""}" onclick="setTab('${id}')">${label}`+
    (id==="machines"&&pending?`<span class="n">${pending}</span>`:"")+`</button>`).join("");
  $("#whoami").style.color = state.tab==="account" ? "var(--ink)" : "";
  const body = {tools:renderTools,toolsets:renderToolSets,machines:renderMachines,catalog:renderCatalog,labels:renderLabels,account:renderAccount}[state.tab]();
  // A fresh account is empty, which makes Loobric hard to "see". Offer the demo
  // right where a first-timer lands — but not on the Account tab, which already
  // carries the demo/reset controls.
  const banner = (accountIsEmpty() && state.tab!=="account") ? `
    <div class="card" style="border-left:3px solid var(--ok)">
      <div class="row"><strong>Your account is empty</strong></div>

      <div class="arow" style="margin-top:.6rem"><button class="mini create" onclick="addDemoData()">Add demo data</button></div>
    </div>` : "";
  $("#view").innerHTML = banner + body;
}

// Every id shown in the UI is a link to its record's schema JSON. One resolver

// ---- tool set from a machine (orchestrates existing canonical doors) --------
function _boundInstances(machineId){
  return [...new Set((state.entriesByMachine[machineId]||[]).map(s=>cf(s,"bound_instance_id")).filter(Boolean))];
}
async function createSetFromMachine(machineId){
  const mname=state.machineNames[machineId], ids=_boundInstances(machineId);
  if(!ids.length){ toast("No bound tools on this machine yet - bind/confirm some first."); return; }
  const name=await promptDialog(`New tool set from ${mname} (${ids.length} bound tool(s)):`, mname);
  if(name===null) return; if(!name.trim()){ toast("A name is required."); return; }
  try{
    const sid=(await api("POST","/tool-set-records",{})).internal.id;   // no client section: the web UI isn't a data client
    await api("POST","/tool-set-records/"+sid+"/assert",{path:"name",value:name.trim(),actor:"human@web"});
    // Claim the numbers the machine currently shows, so the new set is
    // immediately satisfied (mounted, at the claimed numbers, confirmed).
    const numByInst={};
    for(const s of (state.entriesByMachine[machineId]||[])){
      const b=cf(s,"bound_instance_id"); if(b) numByInst[b]=cf(s,"tool_number");
    }
    await api("POST","/tool-set-records/"+sid+"/members",{actor:"human@web",
      members:ids.map(id=>({tool_record_id:id, number:numByInst[id]}))});
    await api("POST","/machine-set-maps",{machine_id:machineId, tool_set_id:sid});
    toast(`Created "${name.trim()}" from ${mname} (${ids.length} tool(s)) and made it the active setup.`);
    state.tab="toolsets"; refresh();
  }catch(e){ toast(e.message); }
}

async function useSet(machineId, setId){

               toast("Setup switched. Nothing on either side was changed."); }
    else{ const cur=state.mapByMachine[machineId];
          if(cur){ await api("POST","/machine-set-maps/"+cur.id+"/end"); toast("Setup ended."); } }

// A suggested name for an instance: its own name, else the label of an entry it's bound in.
function instanceNameHint(id){

  for(const s of Object.values(state.entriesById)) if(cf(s,"bound_instance_id")===id){ const sn=entryName(s); if(sn) return sn; }

// ---- Labels (physical stickers; docs/LABELS.md) -----------------------------
// A label is blank until it's on a record; only this account's codes work.
function labelsFor(id){ return state.labels.filter(l=>l.entity_id===id); }
function blankLabels(){ return state.labels.filter(l=>!l.entity_id); }

// PDF endpoints return bytes, not JSON — fetch a blob and open it.
async function apiPdf(path, body){
  const r = await fetch("/api/v1"+path, {method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||("HTTP "+r.status)); }
  const url = URL.createObjectURL(await r.blob());
  window.open(url, "_blank");
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

// Sticker stocks the sheet endpoint knows; the picker on the Labels tab
// remembers the shop's printer for both minting and reprints.
const LABEL_STOCKS = {
  "avery-5160":       {label:"Avery 5160 sheet (30-up)",        per:30},
  "thermal-4x6":      {label:'4"x6" thermal label (12, cut apart)', per:12},
  "thermal-4x6-wide": {label:'4"x6" thermal, wide 57x32 (4, cut apart)', per:4},
  "thermal-57x32":    {label:"57x32 mm thermal roll (1/label)",  per:1},
};
// Picking a stock and pressing Print mints one full sheet, no questions;
// "Custom count…" is the one choice that asks (and prints on the last
// concrete stock picked).
let labelStock = "avery-5160", labelCustom = false;
function setLabelChoice(v){
  if(v==="custom") labelCustom=true;
  else if(LABEL_STOCKS[v]){ labelCustom=false; labelStock=v; }
}

// Mint-and-print a batch of blanks: the drawer workflow (stick one on whatever
// you're holding, then scan it to attach a record).
async function printBlankSheet(){
  let n = LABEL_STOCKS[labelStock].per;
  if(labelCustom){
    const raw = await promptDialog(
      `How many blank labels? (printed on ${LABEL_STOCKS[labelStock].label})`,
      String(n));
    if(raw===null) return;
    n = parseInt(raw, 10);
    if(!(n>=1 && n<=100)){ toast("Count must be 1-100."); return; }
  }
  try{ await apiPdf("/labels/sheet", {count:n, stock:labelStock});
       toast(n+" blank label(s) minted — print at 100% scale."); refresh(); }
  catch(e){ toast(e.message); }
}
async function reprintLabel(labelId){
  try{ await apiPdf("/labels/sheet", {label_ids:[labelId], stock:labelStock}); }
  catch(e){ toast(e.message); }
}
// Put a label on a tool: a blank code from the sheet on the bench, or mint one.
async function labelTool(toolId){
  const blanks = blankLabels();
  if(!blanks.length){
    if(!(await confirmDialog("No blank labels on hand — mint a new label for this tool?"))) return;
    try{ await api("POST","/labels",{entity_id:toolId}); toast("Labeled — print it from the tool card."); refresh(); }
    catch(e){ toast(e.message); }
    return;
  }
  const code = await promptDialog("Which label code? Blank: "+
    blanks.slice(0,8).map(l=>l.code).join(", ")+(blanks.length>8?", …":""), blanks[0].code);
  if(code===null || !code.trim()) return;
  try{ await api("POST","/tool-instance-records/"+toolId+"/label",{code:code.trim()});
       toast("Labeled."); refresh(); }catch(e){ toast(e.message); }
}
async function unlabelTool(toolId, code){
  if(!(await confirmDialog("Take label "+code+" off this tool? The sticker's page goes back to the landing page and the label is reusable."))) return;
  try{ await api("POST","/tool-instance-records/"+toolId+"/unlabel",{code});

// ---- Spec labels (printed spec plates; docs/SPEC_LABELS.md) -----------------
// A spec label is a printed RENDERING of a record — specs in ink for
// at-the-toolbox identification — not a Label. Everything printed is a
// snapshot at print time; the QR (qr-specs template) stays late-bound.
const SPEC_TEMPLATES = {
  "qr-specs":    "QR + specs",
  "spec-plaque": "Spec plaque (no QR)",
};
const SPEC_STOCKS = {
  "avery-5160":       "Avery 5160 sheet (30-up)",
  "thermal-4x6":      '4"x6" thermal label (12, cut apart)',
  "thermal-4x6-wide": '4"x6" thermal, wide 57x32 (4, cut apart)',
  "thermal-57x32":    "57x32 mm thermal roll",
  "plaque-38x19":     "38x19 mm plaque",
  "plaque-50x25":     "50x25 mm plaque",
  "plaque-25x25":     "25x25 mm plaque",
};
let specTemplate = "qr-specs", specStock = "avery-5160";
function togglePrintSel(id){
  if(state.printSel[id]) delete state.printSel[id]; else state.printSel[id]=true;
  render(); }
function printSelCount(){ return Object.keys(state.printSel).length; }
async function printSpecLabels(){
  const ids = Object.keys(state.printSel);
  if(!ids.length){ toast("Select tools to print first."); return; }
  const r = await fetch("/api/v1/spec-labels/sheet", {method:"POST",
    credentials:"same-origin", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({record_ids:ids, template:specTemplate, stock:specStock})});
  if(r.ok){
    const url = URL.createObjectURL(await r.blob());
    window.open(url, "_blank");
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    toast("Print at 100% scale. Printed specs are a snapshot — reprint after a regrind or rebind.");
    return;
  }
  const d = await r.json().catch(()=>({}));
  const unlabeled = d.detail && d.detail.unlabeled_record_ids;
  if(r.status===400 && unlabeled){
    // Printing never mints — but the user can, explicitly, right here.
    if(await confirmDialog(unlabeled.length+" selected tool(s) have no label yet, and this layout prints a QR. Create labels for them now?")){
      try{ for(const rid of unlabeled) await api("POST","/labels",{entity_id:rid});
           refresh(); await printSpecLabels(); }
      catch(e){ toast(e.message); }
    }
    return;
  }
  toast((d.detail && d.detail.message) || d.detail || ("HTTP "+r.status));
}

// entry rows holding each instance: { instance_id: [{m, n}, ...] }
function _boundAtMap(){

    const b=cf(s,"bound_instance_id"); if(b)(boundAt[b]=boundAt[b]||[]).push({m,n:cf(s,"tool_number")}); }
  return boundAt;
}

function renderTools(){
  if(state.toolSel) return renderToolDetail();
  if(!state.tools.length) return `<div class="empty">No tool instances yet.<br><span class="muted">They appear as machines report tools and you bind them, or as clients sync.</span></div>`;

      T#, silhouette) for tools you identify by reading, not scanning. Check tools

      snapshot &mdash; reprint after a regrind or rebind; a QR on the label always

  </div>`;
  const rows = state.tools.map(t=>{
    const dia=cf(t,"geometry.diameter"), shape=cf(t,"geometry.shape"), hours=cf(t,"usage.hours");
    const retired=cf(t,"status")==="retired", where=(boundAt[rid(t)]||[]);
    const nlbl=labelsFor(rid(t)).length;
    return `<div class="trow">
      <span class="tinfo">
        <input type="checkbox" ${state.printSel[rid(t)]?"checked":""}
          onclick="togglePrintSel('${rid(t)}')" title="select for spec-label printing">

// ---- Tool Sets -------------------------------------------------------------
function openSet(id){ state.tab="toolsets"; state.setSel=id; render(); }

async function removeMember(setId, toolId){
  const s=state.toolsets.find(x=>rid(x)===setId); if(!s) return;
  const tname=state.toolNames[toolId]||toolId.slice(0,8);
  if(!(await confirmDialog(`Remove "${tname}" from "${cf(s,"name")||setId.slice(0,8)}"? The tool itself isn't deleted.`))) return;
  // Read-modify-write over the replace-only members door (the same move as
  // `loobric remove-from-set`): keep every other member and its number, drop this one.
  const members=(s.canonical.members||[])
    .filter(m=>m.tool_record_id!==toolId)
    .map(m=>({tool_record_id:m.tool_record_id, number:(m.number||{}).value}));
  try{ await api("POST","/tool-set-records/"+setId+"/members",{members, actor:"human@web"}); toast("Removed from set."); refresh(); }
  catch(e){ toast(e.message); }
}

// A member's per-line state label + detail, per the ratified vocabulary
// (satisfied lines read "ok"; anything else is an unmet claim).
function memberStateBadge(m){
  const st=m.state, obs=(m.observed||{}).value, num=(m.number||{}).value;

    : st==="blocked" ? ` T${num} is occupied by a different tool`
    : st==="pending bind" ? ` mounted, confirm identity`
    : st==="requested" ? ` not on machine` : "";
  return `<span class="pill unbound">${esc(st)}</span><span class="muted">${detail}</span>`;
}
function renderToolSetDetail(){

// ---- Machines: a LIST page (like Tool Sets), each opening one machine's page.

// ---- one machine's page: ONE unified list of every line — table entries AND
// the active setup's not-yet-mounted claims — each with its status inline.
// No separate "needs fixing" block: ready and not-ready live in the same list
// (color/font differentiation can come later). Display-only except binding
// (the one act only Loobric can record) and the setup picker.
function renderMachineDetail(){
  const m=state.machines.find(x=>rid(x)===state.machineSel);
  if(!m) return `<div class="empty">Machine not found.<br><span class="link-ish" onclick="backToMachines()">Back to machines</span></div>`;
  const mid=rid(m), recon=state.reconByMachine[mid];
  const active = recon && recon.active;

  // Per-entry status from the setup view: claims consume their entry
  // (satisfied/mismounted/pending bind); notes cover the rest.
  const claimByEntry={}, noteByEntry={};
  if(active){
    for(const c of (recon.claims||[])) if(c.entry_id && c.state!=="blocked") claimByEntry[c.entry_id]=c;
    for(const n of (recon.notes||[])) if(n.entry_id) noteByEntry[n.entry_id]=n;
  }

  let entries=(state.entriesByMachine[mid]||[]).slice();
  if(state.pendingOnly) entries=entries.filter(s=>hasProposal(s));
  const rows = entries.map(s=>({num: cf(s,"tool_number") ?? 1e9,
                                html: entryRow(m, s, entryStatus(s, claimByEntry, noteByEntry))}));
  // Claims with no entry of their own (requested; blocked — the wanted tool
  // isn't mounted anywhere): they get a line in the SAME list, at their
  // claimed number, so a pre-mount tool is never invisible.
  if(active && !state.pendingOnly){
    for(const c of (recon.claims||[])){
      if(c.state==="requested" || c.state==="blocked")
        rows.push({num:(c.number||{}).value ?? 1e9, html: claimRow(c)});
    }
  }
  rows.sort((a,b)=>a.num-b.num);
  const body = rows.length ? rows.map(r=>r.html).join("")
    : `<div class="muted">${state.pendingOnly?"nothing pending on this machine":"empty tool table"}</div>`;

  const picker = `<select class="mini" onchange="useSet('${mid}', this.value||null)">
      <option value="">&mdash; no setup &mdash;</option>`+
    state.toolsets.map(s=>`<option value="${rid(s)}" ${state.mapByMachine[mid]&&state.mapByMachine[mid].tool_set_id===rid(s)?"selected":""}>${esc(cf(s,"name")||rid(s).slice(0,8))}</option>`).join("")+
    `</select>`;
  const att = (recon||{}).attention||{};
  const summary = active
    ? `${recon.ready?`<span class="pill bound">READY</span>`:`<span class="pill unbound">NOT READY</span>`} <b>${esc(recon.tool_set_name||"(unnamed)")}</b> <span class="muted">&middot; ${att.important||0} need attention &middot; ${att.notes||0} note(s)</span>`
    : `<span class="muted">No active setup &mdash; pick the tool set this machine is being set up for.</span>`;
  const pendingHere = entries.some(s=>hasProposal(s)) || pendingEntries().length;
  const filter = pendingHere
    ? `<label style="white-space:nowrap"><input type="checkbox" ${state.pendingOnly?"checked":""} onclick="togglePending()"> only pending review</label>` : "";

  return `<div class="row" style="margin-bottom:.6rem">
      <button class="mini link" onclick="backToMachines()">&#x2190; Back to machines</button>
      <span class="rowact">
        <button class="mini create" onclick="createSetFromMachine('${mid}')">Create tool set</button>
        <button class="unbind" onclick="deleteMachine('${mid}')">Delete machine</button></span></div>
    <div class="card">
      <div class="row"><strong>${esc(state.machineNames[mid])}</strong>
        <span class="rowact">${idLink(mid)}<span class="muted">${esc(cf(m,"controller_type")||"")}</span></span></div>
      <div class="row" style="margin-top:.5rem">${summary}<span class="rowact">${filter} ${picker}</span></div>
      <div class="section-h">Tools</div>
      ${body}</div>`;
}

// The status text for an entry row, from the setup view. "" when no setup is
// active (the row then just shows its bind state, as before).
function entryStatus(s, claimByEntry, noteByEntry){
  const c=claimByEntry[rid(s)];
  if(c){
    if(c.state==="satisfied") return {label:"ok", ok:true};
    if(c.state==="mismounted")
      return {label:`mismounted &mdash; CAM says T${(c.number||{}).value}`, ok:false};
    if(c.state==="pending bind") return {label:"pending bind", ok:false};
  }
  const n=noteByEntry[rid(s)];
  if(n) return {label:esc(n.state), ok:null};   // unlisted / unknown tool: a note
  return null;
}

// One row per tool-table entry. Binding lives here (the single binding surface):
// an unbound entry the server proposed a match for offers Same tool / Different /
// Bind new — the SAME options the old Inbox had — so you can confirm the server's
// guess instead of being funnelled into minting a duplicate. An unbound entry
// with no proposed match just offers Bind new. `status` (from the setup view)
// rides inline in the same row — never a separate list.
function entryRow(m,s,status){
  const bound=cf(s,"bound_instance_id"), dia=cf(s,"offsets.diameter");
  const p = bound ? null : state.proposalByEntry[rid(s)];
  const matched = p && p.proposed_instance && p.proposed_instance.id;
  const guess = matched
    ? `<span class="muted"> &#x2192; same as <b>${esc(p.proposed_instance.name||p.proposed_instance.id.slice(0,8))}</b>${p.proposed_instance.diameter!=null?" &#x2300;"+p.proposed_instance.diameter:""}${typeof p.confidence==="number"?" &middot; "+Math.round(p.confidence*100)+"%":""}</span>`
    : "";
  let actions;
  if(bound){
    actions = `<button class="unbind" onclick="unbindEntry('${rid(s)}')">Unbind</button>`;
  } else if(matched){
    actions = `<button class="mini confirm" onclick="confirmProp('${p.id}')">Same tool</button>`+
              `<button class="mini reject" onclick="rejectProp('${p.id}')">Different</button>`+
              `<button class="mini create" onclick="bindNew('${rid(s)}')">Bind new</button>`;
  } else {
    actions = `<button class="mini create" onclick="bindNew('${rid(s)}')">Bind new</button>`;
  }
  const badge = status
    ? (status.ok===true ? `<span class="pill bound">ok</span>`
       : status.ok===false ? `<span class="pill unbound">${status.label}</span>`
       : `<span class="pill info">${status.label}</span>`)
    : "";
  return `<div class="trow">
    <div class="tinfo">
      <span class="tnum link-ish" onclick="showById('${rid(s)}')">T${cf(s,"tool_number")}</span>
      <span>${esc(entryName(s)||"")}</span>
      <span class="muted">${dia!=null?"&#x2300;"+dia:""}</span>
      ${bound?`<span class="pill bound">${esc(state.toolNames[bound]||bound.slice(0,8))}</span>`:`<span class="pill unbound">unbound</span>`}
      ${bound&&isRetired(bound)?`<span class="pill unbound">retired tool mounted</span>`:""}
      ${badge}
      ${guess}
    </div>
    <div class="rowact">${actions}
      <button class="mini del" onclick="deleteEntry('${rid(s)}')">Remove</button></div>
  </div>`;
}

// A claim with no mounted tool of its own (requested / blocked): a line in the
// SAME list at its claimed number — not a separate section.
function claimRow(c){
  const num=(c.number||{}).value;
  const detail = c.state==="requested"
    ? `requested &mdash; not on machine`
    : `blocked &mdash; T${num} occupied by <b>${esc((c.blocked_by&&c.blocked_by.name)||"another tool")}</b>`;
  return `<div class="trow">
    <div class="tinfo">
      <span class="tnum">${num!=null?"T"+num:"?"}</span>
      <span>${esc(c.name||c.tool_record_id.slice(0,8))}</span>
      <span class="pill unbound">${esc(c.state)}</span>
      <span class="muted">${detail}</span>
    </div>
  </div>`;
}

// ---- Media view (canonical.media) ------------------------------------------
// A record's canonical.media is a list of {role, ref, content_type, filename,
// size}. We SHOW it so a human can visually confirm an imported tool: raster
// images inline, mesh 3D models in an in-browser WebGL viewer (online-3d-viewer,
// loaded lazily from a CDN — no build step), everything else as a download link.
//
// STEP renders too: online-3d-viewer >=0.15 reads STEP/IGES via its
// occt-import-js (OpenCascade) kernel, which it fetches from the CDN itself —
// it wraps the kernel in a same-origin blob worker on the fly, so there is no
// vendoring and no build step, just a brief one-time WASM download on first 3D
// view. Mesh formats render instantly (bundled JS loaders). See TOOL_SCHEMA §7.7.
const O3DV_VERSION = "0.18.0";
const O3DV_ENGINE_URL = "https://cdn.jsdelivr.net/npm/online-3d-viewer@"+O3DV_VERSION+"/build/engine/o3dv.min.js";
// Mesh formats with loaders bundled in the engine (pure JS) — render instantly.
const VIEWABLE_MESH = new Set(["stl","obj","ply","off","3ds","gltf","glb","fbx","dae","wrl","vrml","3mf"]);
// CAD solids o3dv renders through its CDN-fetched occt (OpenCascade) kernel.
const VIEWABLE_CAD = new Set(["step","stp","ste","iges","igs","ige","brep","brp"]);
const VIEWABLE_3D = new Set([...VIEWABLE_MESH, ...VIEWABLE_CAD]);
const MEDIA_ROLE_LABEL = {model_3d:"3D model", model_3d_basic:"3D model (basic)",
  drawing_2d:"2D drawing", image:"Image", icon:"Icon", logo:"Logo", document:"Document"};

function mediaBytesUrl(base,id,ref){ return "/api/v1/"+base+"/"+id+"/media/"+ref; }
function mediaExt(m){ const f=m.filename||""; const i=f.lastIndexOf("."); return i>=0?f.slice(i+1).toLowerCase():""; }
function mediaIsImage(m){ const ct=(m.content_type||"").toLowerCase();
  return ct.indexOf("image/")===0 || ["png","jpg","jpeg","gif","webp","bmp","svg"].includes(mediaExt(m)); }
function mediaIsModel(m){ return m.role==="model_3d" || m.role==="model_3d_basic"
  || VIEWABLE_3D.has(mediaExt(m)) || (m.content_type||"").toLowerCase().indexOf("model/")===0; }
function mediaViewable3D(m){ return VIEWABLE_3D.has(mediaExt(m)); }
function humanSize(n){ if(n==null) return ""; if(n<1024) return n+" B";
  if(n<1048576) return (n/1024).toFixed(0)+" KB"; return (n/1048576).toFixed(1)+" MB"; }
function recordMedia(rec){ return (((rec||{}).canonical||{}).media||{}).value || []; }
function _findMediaRecord(id){
  for(const c of (state.catalogs||[])) if(rid(c)===id) return {rec:c, base:"tool-catalog-records"};
  for(const t of (state.tools||[]))    if(rid(t)===id) return {rec:t, base:"tool-instance-records"};
  return null;
}

// The media block for a record's detail/card. Empty string when there's nothing
// to show, so callers can drop it in unconditionally.
function mediaSection(rec, base){
  const items = recordMedia(rec);
  if(!items.length) return "";
  const id = rid(rec);
  const images = items.filter(mediaIsImage);
  const models = items.filter(m=>mediaIsModel(m) && !mediaIsImage(m));
  const others = items.filter(m=>!mediaIsImage(m) && !mediaIsModel(m));
  let html = `<div class="section-h">Media</div>`;
  if(images.length){
    html += `<div class="media-grid">` + images.map(m=>{
      const url = mediaBytesUrl(base,id,m.ref);
      return `<a class="media-thumb" href="${esc(url)}" target="_blank" rel="noopener"
                 title="${esc(m.filename||m.role)}"><img src="${esc(url)}" alt="${esc(m.role)}"></a>`;
    }).join("") + `</div>`;
  }
  html += models.map(m=>{
    const url = mediaBytesUrl(base,id,m.ref), label = MEDIA_ROLE_LABEL[m.role]||"3D model";
    const meta = `<span class="media-meta"><strong>${esc(label)}</strong>`+
      `<span class="muted">${esc(m.filename||"")}${m.size!=null?" &middot; "+humanSize(m.size):""}</span></span>`;
    const dl = `<a class="dl" href="${esc(url)}" download="${esc(m.filename||"")}">Download</a>`;
    if(mediaViewable3D(m)){
      return `<div class="media-item">${meta}<span class="rowact">
        <button class="mini view" onclick="openModelViewer('${id}','${esc(m.ref)}')">View 3D</button>${dl}</span></div>`;
    }
    // A model format the viewer doesn't recognize (STEP/IGES/mesh all render
    // above) — offer the file so a CAD tool can open it.
    return `<div class="media-item">${meta}<span class="rowact">${dl}</span>
      <div class="media-note">Opens in CAD (e.g. FreeCAD). A browser 3D preview of this format isn't shown here.</div></div>`;
  }).join("");
  html += others.map(m=>{
    const url = mediaBytesUrl(base,id,m.ref), label = MEDIA_ROLE_LABEL[m.role]||"File";
    return `<div class="media-item"><span class="media-meta"><strong>${esc(label)}</strong>
      <span class="muted">${esc(m.filename||"")}${m.size!=null?" &middot; "+humanSize(m.size):""}</span></span>
      <a class="dl" href="${esc(url)}" download="${esc(m.filename||"")}">Download</a></div>`;
  }).join("");
  return html;
}

// Lazily pull the viewer engine from the CDN — only when a model is actually
// opened, so the WASM-free engine bundle never loads for media-less records.
let _o3dvLoad=null, _viewer=null, _viewerModels=[], _viewerCtx=null;
function loadViewerEngine(){
  if(window.OV) return Promise.resolve(window.OV);
  if(_o3dvLoad) return _o3dvLoad;
  _o3dvLoad = new Promise((res,rej)=>{
    const s=document.createElement("script"); s.src=O3DV_ENGINE_URL;
    s.onload=()=>window.OV?res(window.OV):rej(new Error("viewer engine missing"));
    s.onerror=()=>{ _o3dvLoad=null; rej(new Error("could not load the 3D viewer engine")); };
    document.head.appendChild(s);
  });
  return _o3dvLoad;
}
function _destroyViewer(){ if(_viewer && _viewer.Destroy){ try{ _viewer.Destroy(); }catch(e){} } _viewer=null; }
function openModelViewer(id, ref){
  const found=_findMediaRecord(id);
  if(!found){ toast("That record isn't loaded in this view."); return; }
  // Prefer the detailed model_3d; offer a basic one as a fallback toggle.
  _viewerModels = recordMedia(found.rec).filter(m=>mediaIsModel(m) && mediaViewable3D(m))
    .sort((a,b)=>(a.role==="model_3d"?0:1)-(b.role==="model_3d"?0:1));
  _viewerCtx = {id, base:found.base};
  const startRef = _viewerModels.some(m=>m.ref===ref) ? ref : ((_viewerModels[0]||{}).ref);
  $("#media").style.display="flex";   // size the host before the viewer measures it
  mountModel(startRef);
}
function _renderViewerTabs(activeRef){
  const tabs=$("#mediatabs");
  tabs.innerHTML = _viewerModels.length<2 ? "" : _viewerModels.map(m=>
    `<button class="mini view ${m.ref===activeRef?"active":""}" onclick="mountModel('${esc(m.ref)}')">${esc(MEDIA_ROLE_LABEL[m.role]||"Model")}</button>`).join("");
}
async function mountModel(ref){
  if(!_viewerCtx) return;
  _renderViewerTabs(ref);
  const host=$("#mediaviewer");
  host.innerHTML = `<div class="muted" style="padding:1rem">Loading 3D model&hellip;</div>`;
  const m=_viewerModels.find(x=>x.ref===ref) || _viewerModels[0];
  if(!m){ host.innerHTML=`<div class="muted" style="padding:1rem">No renderable 3D model.</div>`; return; }
  try{
    const OV=await loadViewerEngine();
    const resp=await fetch(mediaBytesUrl(_viewerCtx.base,_viewerCtx.id,ref), {credentials:"same-origin"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    const blob=await resp.blob();
    // Wrap the bytes in a File named with the real filename — online-3d-viewer
    // picks its loader from the extension (the bytes URL ends in a hash, not .stl).
    const file=new File([blob], m.filename||("model."+(mediaExt(m)||"stl")), {type:m.content_type||""});
    _destroyViewer();
    host.innerHTML="";
    _viewer=new OV.EmbeddedViewer(host, {
      backgroundColor:new OV.RGBAColor(16,21,26,255),
      defaultColor:new OV.RGBColor(180,190,200),
      onModelLoadFailed:()=>{ host.innerHTML=`<div class="muted" style="padding:1rem">Could not read this 3D file in the browser. Use Download to open it in CAD.</div>`; }
    });
    _viewer.LoadModelFromFileList([file]);
  }catch(e){
    host.innerHTML=`<div class="muted" style="padding:1rem">3D preview unavailable: ${esc(e.message)}. Use Download to open the file.</div>`;
  }
}
function closeMedia(){
  $("#media").style.display="none"; _destroyViewer();
  _viewerModels=[]; _viewerCtx=null;
  $("#mediaviewer").innerHTML=""; $("#mediatabs").innerHTML="";
}

// ---- Catalog records (READ-ONLY: the visual drift detector) ----------------
// A ToolCatalogRecord is a nominal, *asserted* published spec. The whole reason
// this surface exists in M2 is provenance visibility: every field is shown next
// to its `source`, so a manufacturer's claim (asserted:…) reads differently from
// a real measurement (observed:…), and an honest gap (unknown) from either.
// No create/edit surface here by design — authoring is CLI-only this slice.
function provBadge(source){
  const src = String(source || "unknown");
  const kind = src.split(":")[0];
  const cls = {asserted:"asserted", observed:"observed", derived:"derived", unknown:"unknown"}[kind] || "unknown";
  return `<span class="prov ${cls}" title="${esc(src)}">${esc(src)}</span>`;
}
// One {value, unit?, source} leaf rendered next to its provenance badge. A null
// value (or an `unknown` source) renders an explicit "unknown" — never a blank
// that could be mistaken for zero/empty.
function catalogField(label, leaf){
  const src = (leaf && leaf.source) || "unknown";
  const kind = String(src).split(":")[0];
  const isUnknown = !leaf || leaf.value == null || kind === "unknown";
  const val = isUnknown
    ? `<span class="unknownval">unknown</span>`
    : linkify(leaf.value) + (leaf.unit ? ` <span class="muted">${esc(leaf.unit)}</span>` : "");
  return `<div class="frow"><span class="flabel">${esc(label)}</span>`+
         `<span class="fval">${val}</span>${provBadge(src)}</div>`;
}
// Per-client sections rendered on a record's detail view. This is where a
// client parks source data that has no canonical home yet — an importer's raw
// attributes, an agent's caveats ("part number unconfirmed"), prices, source
// URLs. Hidden data here misled nobody only because nobody could see it.
function clientSections(rec){
  const cls = rec.clients || {}; const names = Object.keys(cls);
  if(!names.length) return "";
  const secs = names.map(n=>{
    const sec = cls[n] || {}; const data = sec.data || {};
    const rows = Object.entries(data).map(([k,v])=>
      `<div class="frow"><span class="flabel">${esc(k.replace(/_/g," "))}</span>`+
      `<span style="word-break:break-all;text-align:right">${typeof v==="object"?esc(JSON.stringify(v)):linkify(String(v))}</span></div>`).join("");
    const ver = sec.client_version ? ` <span class="muted">v${esc(sec.client_version)}</span>` : "";
    return `<div style="margin-top:.4rem"><div class="muted"><b>${esc(n)}</b>${ver}</div>`+
           (rows || `<div class="muted" style="padding:.45rem 0">no data</div>`)+`</div>`;
  }).join("");
  return `<div class="section-h">Client data</div>
    <div class="explain">What each client recorded about this item in its own section
    &mdash; source details, caveats, prices &mdash; kept verbatim, outside the canonical spec.</div>` + secs;
}

function backToCatalog(){ state.catalogSel=null; render(); }

// Import a manufacturer's downloaded tool-data file (GTC zip, STEP P21,
// DIN 4000 XML/CSV, SolidCAM, hyperMILL). Parsing and creation happen
// server-side; re-importing is idempotent (duplicates report as existing).
async function importCatalogFile(input){
  const f = input.files && input.files[0];
  input.value = "";                    // same file re-selectable next time
  if(!f) return;
  toast("Importing " + f.name + "…");
  const form = new FormData();
  form.append("file", f);
  try{
    const r = await fetch("/api/v1/tool-catalog-records/import",
                          {method:"POST", credentials:"same-origin", body:form});
    const rep = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(rep.detail || ("HTTP "+r.status));
    let msg = `Imported ${f.name} (${rep.format}): ${rep.created.length} created`;
    if(rep.existing.length) msg += `, ${rep.existing.length} already existed`;
    if(rep.skipped.length)  msg += `, ${rep.skipped.length} skipped`;
    if(rep.failed.length)   msg += `, ${rep.failed.length} FAILED`;
    if(rep.media_uploaded)  msg += `, ${rep.media_uploaded} media file(s)`;
    msg += ".";
    if(rep.failed.length || rep.skipped.length){
      const lines = rep.failed.concat(rep.skipped).slice(0,6)
        .map(d=>`• ${d.product_code||d.name||"(unidentified)"} — ${d.reason}`);
      await confirmDialog(msg+"\n\n"+lines.join("\n"));
    } else toast(msg);
    refresh();
  }catch(e){ toast("Import failed: "+e.message); }
}

         accept=".zip,.p21,.stp,.step,.xml,.csv" onchange="importCatalogFile(this)">

// ---- Create tool from catalog (the audited catalog→instance door) ----------
// Browse → this opens a form pre-populated with the catalog's defaults: the name
// is pre-filled and EDITABLE; the nominal geometry is shown READ-ONLY beside its
// provenance badges (what you're creating from). No QA/status fields here — that
// is a deferred future home (M2 form is deliberately thin). Confirm POSTs an
// optional {name} to .../create-instance, which stamps catalog_type_id on a new,
// UNBOUND instance (a catalog is not a machine position).
let _ccFrom = null;   // id of the catalog record the open form is creating from
// How many instances already point back at this catalog record — a client-side
// filter over the already-fetched instances (WHERE catalog_type_id == id), NOT a
// stored back-reference.
function instancesFromCatalog(id){ return state.tools.filter(t=>cf(t,"catalog_type_id")===id); }
function openCreateFromCatalog(id){
  const c=state.catalogs.find(x=>rid(x)===id); if(!c){ toast("Catalog record not found."); return; }
  _ccFrom=id;
  const can=c.canonical||{}, name=cf(c,"name")||"";
  const geom=can.geometry||{}, gKeys=Object.keys(geom);
  const geomRows=gKeys.length
    ? gKeys.map(k=>catalogField(k.replace(/_/g," "), geom[k])).join("")
    : `<div class="muted" style="padding:.45rem 0">No geometry recorded &mdash; honestly sparse, not zero.</div>`;
  const made=instancesFromCatalog(id).length;
  $("#ccbody").innerHTML = `
    <div class="explain" style="margin-top:.6rem">Creating a physical tool from
      <b>${esc(name||"this catalog record")}</b>. The new tool links back to this
      catalog record and is left <b>unbound</b> &mdash; not yet on a machine.</div>
    <label class="cclabel" for="ccname">Name</label>
    <input id="ccname" class="ccinput" value="${esc(name)}" placeholder="tool name"
           onkeydown="if(event.key==='Enter')submitCreateFromCatalog(); else if(event.key==='Escape')closeCreate();">
    <div class="section-h">Nominal geometry (read-only)</div>
    <div class="muted" style="font-size:.82rem;margin-bottom:.2rem">What you're creating from &mdash; the catalog's published spec.</div>
    ${geomRows}
    ${made?`<div class="muted" style="margin-top:.8rem">${made} tool${made===1?"":"s"} already created from this catalog record.</div>`:""}
    <div class="arow">
      <button class="mini reject" onclick="closeCreate()">Cancel</button>
      <button class="mini confirm" onclick="submitCreateFromCatalog()">Create tool</button>
    </div>`;
  $("#ccreate").style.display="flex";
  setTimeout(()=>{ const i=$("#ccname"); if(i){ i.focus(); i.select(); } },30);
}
function closeCreate(){ $("#ccreate").style.display="none"; _ccFrom=null; }
async function submitCreateFromCatalog(){
  if(!_ccFrom) return;
  const id=_ccFrom, name=(($("#ccname")||{}).value||"").trim();
  try{
    const inst=await api("POST","/tool-catalog-records/"+id+"/create-instance", name?{name}:{});
    closeCreate();
    toast(`Created tool "${cf(inst,"name")||rid(inst).slice(0,8)}" — unbound, linked to this catalog record.`);
    refresh();   // re-pull instances so the new tool (and the count) reflect it
  }catch(e){ toast(e.message); }
}

// ---- Account: API keys + change password -----------------------------------
// The browser session authenticates this page; API keys are for non-browser
// clients (the loobric CLI, FreeCAD, LinuxCNC). A new key's plain value is shown
// ONCE at creation (the server only stores its hash), so the create flow reveals
// it for copying and never again.
function renderAccount(){
  const me = state.me || {};
  const keys = state.keys || [];
  const DOOR_NAMES=["read","sync","observe","assert","bind","delete","admin"];
  const keyRows = keys.length ? keys.map(k=>{
    const sc=k.scopes||[];
    const legacy = !(sc.length && sc.every(s=>DOOR_NAMES.includes(s)));

      <span class="tinfo">
        <strong>${esc(k.name||"(unnamed)")}</strong>

        ${scopes?`<span class="muted">${esc(scopes)}</span>`:""}
        ${legacy?'<span class="pill bad" title="Created before scoped keys — now READ-ONLY. Create a new key with the scopes you need.">legacy &middot; read-only</span>':""}
        ${active?"":'<span class="pill bad">revoked</span>'}
      </span>
      ${active?`<button class="mini del" onclick="revokeKey('${esc(k.id)}','${esc(k.name||"")}')">Revoke</button>`
              :`<button class="mini del" onclick="deleteKey('${esc(k.id)}','${esc(k.name||"")}')">Delete</button>`}

  return `
    <div class="card">

          <button class="mini reject" onclick="doLogout()">Sign out</button></span></div>
      <div class="row" style="margin-top:.7rem"><span class="muted">Password</span>

// Scope presets: a key holds the DOORS it may use (read, sync, observe,
// assert, bind, delete, admin). The presets encode the intended holders; the
// AI-agent key deliberately lacks observe/bind/delete — agents assert, never
// observe, and never confirm bindings or delete.
const KEY_PRESETS = {
  agent:      {scopes:"read sync assert",         hint:"AI agent (MCP) — can read, sync, and assert; can never observe, bind, or delete"},
  controller: {scopes:"read sync observe",        hint:"Machine/controller — reports measured truth (tool tables, offsets)"},
  cam:        {scopes:"read sync assert",         hint:"CAM client — reads the crib, writes its own section, asserts"},
  full:       {scopes:"read sync observe assert bind delete", hint:"Full personal key — everything except admin"},
};
function applyKeyPreset(name){
  const p=KEY_PRESETS[name]; if(!p) return;
  $("#kn_scopes").value=p.scopes; $("#kn_hint").textContent=p.hint;
}
function openNewKey(){
  $("#keynewbody").innerHTML = `

    <div class="arow" style="margin:.2rem 0 .4rem">
      <button class="mini" onclick="applyKeyPreset('agent')">AI agent</button>
      <button class="mini" onclick="applyKeyPreset('controller')">Controller</button>
      <button class="mini" onclick="applyKeyPreset('cam')">CAM client</button>
      <button class="mini" onclick="applyKeyPreset('full')">Full</button>
    </div>
    <label class="cclabel" for="kn_scopes">Scopes</label>
    <input id="kn_scopes" class="ccinput" value="" placeholder="e.g. read sync assert">
    <div class="muted" id="kn_hint" style="font-size:.82rem;margin-top:.3rem">Pick a preset, or
      combine doors: read &middot; sync &middot; observe &middot; assert &middot; bind &middot; delete &middot; admin.</div>
    <div class="arow">
      <button class="mini reject" onclick="closeKeyNew()">Cancel</button>
      <button class="mini confirm" onclick="submitNewKey()">Create key</button>
    </div>`;
  $("#keynew").style.display="flex";
  setTimeout(()=>{ const i=$("#kn_name"); if(i) i.focus(); },30);

function closeKeyNew(){ $("#keynew").style.display="none"; }
async function submitNewKey(){
  const name=(($("#kn_name")||{}).value||"").trim();
  const scopes=(($("#kn_scopes")||{}).value||"").trim().split(/\s+/).filter(Boolean);
  if(!name){ toast("A name is required."); return; }
  try{
    const k=await api("POST","/auth/keys",{name, scopes});
    // Reveal the plain key ONCE — the server keeps only its hash.
    $("#keynewbody").innerHTML = `
      <div class="explain" style="margin-top:.6rem">Key <b>${esc(name)}</b> created.
        Copy it now &mdash; it won't be shown again.</div>

        <button class="mini link" onclick="copyKey()">Copy</button>

      </div>`;
  }catch(e){ toast(e.message); }
}
function copyKey(){ const el=$("#kn_value"); if(!el) return;
  const t=el.textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Copied."),()=>toast("Copy failed — select and copy manually."));
  else toast("Copy not supported — select and copy manually.");
}
async function revokeKey(id, name){
  if(!(await confirmDialog(`Revoke API key "${name||String(id).slice(0,8)}"? Any client using it stops working immediately.`))) return;
  try{ await api("DELETE","/auth/keys/"+id); toast("Key revoked."); refresh(); }catch(e){ toast(e.message); }
}
// Deleting is only offered on an already-revoked key (two deliberate steps —
// a working credential can never go straight to gone). Audit rows keep the id.
async function deleteKey(id, name){
  if(!(await confirmDialog(`Permanently delete revoked key "${name||String(id).slice(0,8)}"? Its audit history keeps the id, but the key row is gone for good.`))) return;
  try{ await api("DELETE","/auth/keys/"+id+"?purge=true"); toast("Key deleted."); refresh(); }catch(e){ toast(e.message); }
}

function openChangePw(){
  $("#pw_cur").value=""; $("#pw_new").value=""; $("#pw_new2").value=""; $("#pwerr").textContent="";
  $("#chpw").style.display="flex";
  setTimeout(()=>$("#pw_cur").focus(),30);
}
function closeChpw(){ $("#chpw").style.display="none"; }
async function submitChangePw(){
  const cur=($("#pw_cur")||{}).value||"", n1=($("#pw_new")||{}).value||"", n2=($("#pw_new2")||{}).value||"";
  const err=$("#pwerr"); err.textContent="";
  if(!cur||!n1){ err.textContent="All fields are required."; return; }
  if(n1!==n2){ err.textContent="New passwords don't match."; return; }
  try{
    await api("POST","/auth/change-password",{current_password:cur, new_password:n1});
    closeChpw(); toast("Password changed.");
  }catch(e){ err.textContent=e.message||"Change failed."; }
}

// ---- Audit -----------------------------------------------------------------
function usersTable(){
  // Admin-only roster. The server never sends password hashes or key material —
  // only the per-account summary, so there is nothing secret to leak here.
  const us = state.users || [];
  if(!us.length) return `<div class="muted" style="padding:.45rem 0">No accounts.</div>`;
  const flags = u => [u.is_admin?"admin":null, u.is_active===false?"inactive":null,
                      u.is_verified?"verified":null].filter(Boolean).join(", ");
  return `<table>`+
    `<tr><th>email</th><th>role</th><th>keys</th><th>created</th><th></th></tr>`+
    us.map(u=>`<tr><td>${esc(u.email||"")}</td><td>${esc(u.role||"")}</td>`+
      `<td>${u.api_key_count||0}</td>`+
      `<td class="muted">${esc((u.created_at||"").replace("T"," ").slice(0,16))}</td>`+
      `<td class="muted">${esc(flags(u))}</td></tr>`).join("")+
    `</table>`;
}

// Rendered inside the Account page (audit is housekeeping, not shop data).
function auditTable(){
  if(!state.audit.length) return `<div class="muted" style="padding:.45rem 0">No audit entries.</div>`;
  return `<table><tr><th>when</th><th>op</th><th>what</th></tr>`+
    state.audit.map(l=>`<tr><td class="muted">${esc((l.timestamp||"").replace("T"," ").slice(0,16))}</td>
      <td>${esc(l.operation)}</td><td>${esc(l.entity_type)} ${idLink(l.entity_id)}</td></tr>`).join("")+
    `</table>`;
}

applyHash();
refresh();
setInterval(refresh, 15000);
</script>
